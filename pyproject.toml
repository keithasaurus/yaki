[project]
name = "yaki"
version = "0.1.0"
description = "typesafe web framework"
readme = "README.md"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.10,<4.0"
#dependencies = []

# Use dependency groups for dev/test tools
[dependency-groups]
dev = [
  "pytest==7.4.4",
  "ruff==0.14.2",
  "mypy==1.18.2",
  "hypothesis==6.98.2",
  "coverage==7.11.0",
  "jinja2==3.1.6",
  "uvicorn==0.38.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
